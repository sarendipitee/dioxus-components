[package]
name = "dioxus-attributes"
version = "0.1.0"
edition = "2021"
description = "Proc macro for creating dynamic attribute lists for Dioxus elements"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true
doctest = false

[dependencies]
# This package is intentionally excluded from the root workspace, so it cannot
# inherit the root workspace dependency declaration.
dioxus-rsx = "0.7.10"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
