[workspace]
resolver = "3"
members = [
	"primitives",
	"preview",
	"test-harness",
	"dioxus-components",
	"themes",
]
# Dioxus wraps workspace members with `dx rustc`, which bypasses Kache's
# reusable compiler cache. Keep this local proc-macro as a path dependency,
# but compile it as an external package so the outer Kache wrapper can cache it.
exclude = ["dioxus-attributes"]

[workspace.dependencies]
dioxus-components = { path = "dioxus-components" }
dioxus-attributes = { path = "dioxus-attributes" }
dioxus-primitives = { path = "primitives" }
tracing = { version = "0.1", features = ["std"] }

dioxus = { version = "0.7.10", default-features = false }
dioxus-rsx = "0.7.10"


[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.dev]
debug = 0
incremental = false

[profile.test]
incremental = false

[profile.dev.build-override]
opt-level = 3
codegen-units = 1
